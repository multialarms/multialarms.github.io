
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - MultiAlarms</title>
    <style>
        body {
            background-color: #1a3559;
            color: #ffffff; /* White text for contrast */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .contact-container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
            border-radius: 8px;
            background-color: #0f1e3a;
        }
        h1 {
            /* Use a linear gradient for the multi-tone effect */
 		 background: linear-gradient(to bottom, #f9ef2c, #eb4e00);
  		-webkit-background-clip: text;
 		 background-clip: text;
  		-webkit-text-fill-color: transparent;
  		color:#FFD700; /* Fallback for browsers that don't support background-		clip: text */
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 5px;
            /* Use a linear gradient for the multi-tone effect */
 		 background: linear-gradient(to bottom, #f9ef2c, #eb4e00);
  		-webkit-background-clip: text;
 		 background-clip: text;
  		-webkit-text-fill-color: transparent;
  		color:#FFD700; /* Fallback for browsers that don't support background-		clip: text */
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 4px;
            background-color: #ffffff;
            color: #000000;
            box-sizing: border-box;
        }
        textarea {
            height: 150px;
            resize: vertical;
        }
        .captcha {
            margin-bottom: 20px;
        }
        button {
            background-color: #00bfff; /* Blue button to match the 'blue feel' */
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            display: block;
            margin: 0 auto;
        }
        button:hover {
            background-color: #009acd; /* Darker blue on hover */
        }

	.error {
            color: #ff5555;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            padding: 10px;
            background-color: rgba(255, 85, 85, 0.15);
            border-radius: 4px;
        }
	
        .privacy-terms {
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 12px;
        }
        .privacy-terms a {
            color: #00bfff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="contact-container">
        <h1>Contact Us</h1>
        <form action="https://formsubmit.co/multialarmspro@gmail.com" method="POST">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Your name (optional)">

            <label for="email">Your e-mail</label>
            <input type="email" id="email" name="email" placeholder="Enter a valid e-mail address" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>

	    <!-- <input type="hidden" name="_captcha" value="false">  (disables Formsubmit's if you want none) -->

            <div class="privacy-terms">
                <a href="#">Privacy-Terms</a>
            </div>

            <button type="submit">Send</button>

            <!-- Formsubmit hidden fields -->
            <input type="hidden" name="_subject" value="New Contact Form Submission from MultiAlarms">
            <input type="hidden" name="_next" value="https://multialarms.com/thank-you.html">
           
        </form>
    </div>
</body>
</html>
